[project]
name = "codex-gateway"
version = "1.0.0"
description = "Serves a ChatGPT subscription as a keyless OpenAI-compatible provider"
requires-python = ">=3.11"

# aiohttp is the only runtime dependency. OAuth runs on stdlib urllib so the
# container does not carry a second HTTP stack for three requests.
dependencies = ["aiohttp>=3.10,<4"]

[project.scripts]
codex-gateway = "codex_gateway.__main__:main"
codex-gateway-login = "codex_gateway.login:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
